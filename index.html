<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="奶茶连连消" />
  <title>奶茶连连消</title>
  <style>
    :root {
      --bg1: #fff0f2;
      --bg2: #fff8d6;
      --panel: rgba(255, 255, 255, 0.85);
      --card: #fff6ed;
      --title: #5d3b2f;
      --text: #8b5e3c;
      --shadow: rgba(108, 75, 58, 0.18);
      --board-bg: #fbe9d3;
      --cell-size: 60px;
      --gap: 10px;
      --tile-shadow: rgba(93, 59, 47, 0.14);
      --highlight: #ffe070;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, #fff7d7 0%, transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--title);
      overflow: hidden;
      position: fixed;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .game {
      width: 100%;
      max-width: 90vw;
      height: 100%;
      max-height: 90vh;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 28px;
      box-shadow: 0 20px 50px var(--shadow);
      padding: 20px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    .score-box {
      min-width: 120px;
      background: linear-gradient(135deg, #fff5d6, #ffe9b1);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.04);
      text-align: center;
    }

    .score-box .label {
      display: block;
      font-size: 12px;
      color: #9d704d;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .score-box .value {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
      margin-top: 6px;
      color: var(--title);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .status {
      font-size: 1rem;
      color: #916b46;
      flex: 1;
      min-height: 24px;
      text-align: left;
      line-height: 1.4;
    }

    button {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffb7a5, #ff8d8d);
      color: white;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255, 128, 128, .25);
      transition: transform .12s ease, box-shadow .12s ease;
      font-size: 1rem;
      white-space: nowrap;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(255, 128, 128, .2);
    }

    .board-wrap {
      background: linear-gradient(180deg, #fef7ee, #f9e2c8);
      border-radius: 22px;
      padding: 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
      flex: 1;
      display: flex;
      place-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, var(--cell-size));
      grid-template-rows: repeat(8, var(--cell-size));
      gap: var(--gap);
      width: fit-content;
      height: fit-content;
      padding: 10px;
      background: var(--board-bg);
      border-radius: 16px;
      box-shadow: inset 0 0 12px rgba(119, 74, 53, 0.08);
    }

    .cell {
      position: relative;
      width: var(--cell-size);
      height: var(--cell-size);
      border: none;
      border-radius: 18px;
      background: rgba(255,255,255,0.36);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-user-select: none;
    }

    .cell:active {
      transform: scale(0.95);
    }

    .cell.selected {
      box-shadow: 0 0 0 4px var(--highlight), 0 12px 20px rgba(239, 170, 44, .25);
      transform: scale(1.06);
    }

    .tile {
      position: relative;
      width: 88%;
      height: 88%;
      border-radius: 16px;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 16px var(--tile-shadow);
      font-weight: 900;
      font-size: 1.5rem;
      line-height: 1;
      color: rgba(44, 30, 24, 0.85);
      border: 2px solid rgba(255,255,255,0.5);
      overflow: hidden;
      pointer-events: none;
    }

    .tile::before {
      content: "";
      position: absolute;
      width: 68%;
      height: 38%;
      left: 16%;
      top: 14%;
      background: rgba(255,255,255,0.28);
      border-radius: 14px 14px 18px 18px;
      transform: rotate(-8deg);
    }

    .tile::after {
      content: "";
      position: absolute;
      width: 62%;
      height: 14%;
      left: 19%;
      bottom: 12%;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
    }

    .tile .label {
      position: relative;
      z-index: 1;
      display: inline-block;
      transform: translateY(3px);
      text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    }

    .tile .splash {
      position: absolute;
      bottom: 7px;
      right: 8px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      box-shadow:
        -10px -3px 0 rgba(255,255,255,0.24),
        -4px -12px 0 rgba(255,255,255,0.2);
    }

    .tile.milk { background: linear-gradient(135deg, #f6d7aa, #f1b66a); }
    .tile.strawberry { background: linear-gradient(135deg, #ffbfd0, #ff8ec2); }
    .tile.mango { background: linear-gradient(135deg, #ffd96d, #ffb143); }
    .tile.coconut { background: linear-gradient(135deg, #c7f2a8, #7ccf8a); }
    .tile.orange { background: linear-gradient(135deg, #ffd59b, #ff9d4d); }
    .tile.pearl { background: linear-gradient(135deg, #d8c5ff, #a78ef8); }
    .tile.matcha { background: linear-gradient(135deg, #d3f9bf, #7fc795); }

    @media (max-width: 600px) {
      :root {
        --cell-size: 48px;
        --gap: 8px;
      }

      .game {
        padding: 16px;
        gap: 12px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .score-box {
        min-width: 100px;
        padding: 10px 14px;
      }

      .score-box .value {
        font-size: 1.6rem;
      }

      .status {
        font-size: 0.95rem;
      }

      button {
        padding: 10px 14px;
        font-size: 0.95rem;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="header">
      <h1>🧋奶茶消消乐</h1>
      <div class="score-box">
        <span class="label">分数</span>
        <span class="value" id="score">0</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="status" id="status">选择两个相邻奶茶交换</div>
      <button id="restartBtn">重新开始</button>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
  </div>

  <script>
    const SIZE = 8;
    const TYPES = [
      { key: "milk", label: "奶", className: "milk" },
      { key: "strawberry", label: "莓", className: "strawberry" },
      { key: "mango", label: "芒", className: "mango" },
      { key: "coconut", label: "椰", className: "coconut" },
      { key: "orange", label: "柑", className: "orange" },
      { key: "pearl", label: "珍", className: "pearl" },
      { key: "matcha", label: "抹", className: "matcha" }
    ];

    const boardEl = document.getElementById("board");
    const scoreEl = document.getElementById("score");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");

    let board = [];
    let selected = null;
    let score = 0;
    let animating = false;

    function randomType() {
      return TYPES[Math.floor(Math.random() * TYPES.length)];
    }

    function buildEmptyBoard() {
      return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    }

    function fillBoardNoMatches() {
      board = buildEmptyBoard();

      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          let type;
          do {
            type = randomType();
          } while (
            (x >= 2 &&
              board[y][x - 1]?.key === type.key &&
              board[y][x - 2]?.key === type.key) ||
            (y >= 2 &&
              board[y - 1][x]?.key === type.key &&
              board[y - 2][x]?.key === type.key)
          );

          board[y][x] = { ...type };
        }
      }
    }

    function updateScore() {
      scoreEl.textContent = String(score);
    }

    function renderBoard() {
      boardEl.innerHTML = "";

      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.x = x;
          cell.dataset.y = y;

          const tile = board[y][x];
          if (tile) {
            const tileEl = document.createElement("div");
            tileEl.className = `tile ${tile.className}`;
            tileEl.innerHTML = `
              <span class="label">${tile.label}</span>
              <span class="splash"></span>
            `;
            cell.appendChild(tileEl);
          }

          if (selected && selected.x === x && selected.y === y) {
            cell.classList.add("selected");
          }

          cell.addEventListener("click", () => handleCellClick(x, y));
          boardEl.appendChild(cell);
        }
      }
    }

    function inBounds(x, y) {
      return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
    }

    function isAdjacent(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;
    }

    function swapTiles(a, b) {
      const temp = board[a.y][a.x];
      board[a.y][a.x] = board[b.y][b.x];
      board[b.y][b.x] = temp;
    }

    function getMatches() {
      const matched = new Set();

      for (let y = 0; y < SIZE; y++) {
        let startX = 0;
        while (startX < SIZE) {
          const cur = board[y][startX];
          if (!cur) { startX++; continue; }

          let endX = startX + 1;
          while (endX < SIZE && board[y][endX] && board[y][endX].key === cur.key) {
            endX++;
          }

          if (endX - startX >= 3) {
            for (let x = startX; x < endX; x++) matched.add(`${x},${y}`);
          }
          startX = endX;
        }
      }

      for (let x = 0; x < SIZE; x++) {
        let startY = 0;
        while (startY < SIZE) {
          const cur = board[startY][x];
          if (!cur) { startY++; continue; }

          let endY = startY + 1;
          while (endY < SIZE && board[endY][x] && board[endY][x].key === cur.key) {
            endY++;
          }

          if (endY - startY >= 3) {
            for (let y = startY; y < endY; y++) matched.add(`${x},${y}`);
          }
          startY = endY;
        }
      }

      return matched;
    }

    function collapseBoard() {
      for (let x = 0; x < SIZE; x++) {
        let writeY = SIZE - 1;
        for (let y = SIZE - 1; y >= 0; y--) {
          if (board[y][x]) {
            board[writeY][x] = board[y][x];
            if (writeY !== y) board[y][x] = null;
            writeY--;
          }
        }

        for (let y = writeY; y >= 0; y--) {
          board[y][x] = null;
        }

        for (let y = 0; y <= writeY; y++) {
          board[y][x] = randomType();
        }
      }
    }

    function resolveBoard() {
      let matches = getMatches();

      if (matches.size === 0) {
        const hasMove = hasPossibleMove();
        if (!hasMove) {
          statusEl.textContent = "✨ 没有可用移动，重排奶茶中...";
          fillBoardNoMatches();
          renderBoard();
        }
        animating = false;
        return;
      }

      score += matches.size * 10;
      updateScore();

      for (const pos of matches) {
        const [x, y] = pos.split(",").map(Number);
        board[y][x] = null;
      }

      statusEl.textContent = `🎉 消掉了 ${matches.size} 个奶茶！`;
      renderBoard();

      setTimeout(() => {
        collapseBoard();
        renderBoard();
        setTimeout(() => {
          if (getMatches().size > 0) {
            resolveBoard();
          } else {
            selected = null;
            animating = false;
            renderBoard();
            statusEl.textContent = "继续搭配吧，找出更多奶茶组合！";
          }
        }, 150);
      }, 200);
    }

    function hasPossibleMove() {
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const dirs = [
            { x: 1, y: 0 },
            { x: 0, y: 1 }
          ];

          for (const d of dirs) {
            const nx = x + d.x;
            const ny = y + d.y;

            if (!inBounds(nx, ny)) continue;

            const tempA = board[y][x];
            const tempB = board[ny][nx];
            if (!tempA || !tempB) continue;

            [board[y][x], board[ny][nx]] = [tempB, tempA];

            const matches = getMatches();
            [board[y][x], board[ny][nx]] = [tempA, tempB];

            if (matches.size > 0) return true;
          }
        }
      }
      return false;
    }

    function handleCellClick(x, y) {
      if (animating) return;

      const current = { x, y };

      if (!selected) {
        selected = current;
        statusEl.textContent = "✓ 已选择奶茶，再点击相邻的来交换";
        renderBoard();
        return;
      }

      if (selected.x === x && selected.y === y) {
        selected = null;
        statusEl.textContent = "选择两个相邻奶茶交换";
        renderBoard();
        return;
      }

      if (!isAdjacent(selected, current)) {
        selected = current;
        statusEl.textContent = "❌ 只能和相邻奶茶交换";
        renderBoard();
        return;
      }

      animating = true;
      const a = selected;
      const b = current;

      swapTiles(a, b);
      renderBoard();

      const matches = getMatches();
      if (matches.size > 0) {
        selected = null;
        resolveBoard();
      } else {
        setTimeout(() => {
          swapTiles(a, b);
          selected = null;
          animating = false;
          statusEl.textContent = "❌ 这两个奶茶不能配成一组，换别的试试";
          renderBoard();
        }, 300);
      }
    }

    function startGame() {
      score = 0;
      updateScore();
      fillBoardNoMatches();
      selected = null;
      animating = false;
      renderBoard();
      statusEl.textContent = "选择两个相邻奶茶交换";
    }

    restartBtn.addEventListener("click", startGame);

    startGame();

    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.board')) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
